<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>{% block title %}DemoApp (vulnérable){% endblock %}</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; background:#fafafa; color:#222; }
  nav a { margin-right: 15px; text-decoration:none; color:#0b5; font-weight:bold; }
  .banner { background:#c0392b; color:white; padding:8px 12px; font-size:13px; margin-bottom:20px; border-radius:4px;}
  input, textarea { width:100%; padding:8px; margin:6px 0; box-sizing:border-box; }
  button { padding:8px 16px; background:#0b5; color:white; border:none; border-radius:4px; cursor:pointer; }
  .error { color:#c0392b; font-size:13px; }
  .card { border:1px solid #ddd; border-radius:6px; padding:12px; margin:10px 0; background:white;}
</style>
</head>

<nav>
